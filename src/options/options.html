<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Element Screenshotter</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <form id="form">
        <fieldset>
          <legend data-i18n="optElementDetection"></legend>
          <label class="choice">
            <input type="radio" name="elementDetection" value="smart" />
            <span data-i18n="optSmart"></span>
          </label>
          <label class="choice">
            <input type="radio" name="elementDetection" value="exact" />
            <span data-i18n="optExact"></span>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="optHighlight"></legend>
          <label class="choice">
            <input type="checkbox" name="zenBrowserStyle" />
            <span data-i18n="optZenBrowserStyle"></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="showElementLabel" />
            <span data-i18n="optShowElementLabel"></span>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="optArrowKeys"></legend>
          <label class="choice">
            <input type="radio" name="arrowKeys" value="navigate" />
            <span data-i18n="optArrowNavigate"></span>
          </label>
          <label class="choice">
            <input type="radio" name="arrowKeys" value="pointer" />
            <span data-i18n="optArrowPointer"></span>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="optSaveButtons"></legend>
          <label class="choice">
            <input type="checkbox" name="movablePanel" />
            <span data-i18n="optMovablePanel"></span>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="optCursor"></legend>
          <label class="choice">
            <input type="checkbox" name="ownCursor" />
            <span data-i18n="optOwnCursor"></span>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="optShortcut"></legend>
          <div class="shortcut-row">
            <p id="shortcut"></p>
            <button type="button" id="shortcuts" data-i18n="optShortcutButton"></button>
          </div>
        </fieldset>
      </form>

      <div class="footer">
        <button type="button" id="reset" data-i18n="optReset"></button>
        <p id="status" role="status" aria-live="polite"></p>
      </div>

      <dialog id="reset-dialog" aria-labelledby="reset-question">
        <form method="dialog">
          <p id="reset-question" data-i18n="optResetQuestion"></p>
          <div class="buttons">
            <button value="cancel" autofocus data-i18n="optResetCancel"></button>
            <button value="reset" data-i18n="optResetConfirm"></button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
