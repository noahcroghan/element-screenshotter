name: Release

# Push a tag like v1.2.3 to publish a release. The tag must match the version
# in package.json, and CHANGELOG.md must have a section for it.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: pnpm exec tsx scripts/release-notes.ts "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Build the package
        run: |
          pnpm package
          cd out
          sha256sum -- *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Artifact attestations need a public repository on GitHub's free plans.
      # The step is skipped while the repository is private and turns on by
      # itself once it is public. Check with `gh attestation verify`.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/*.zip
            out/SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" out/*.zip out/SHA256SUMS.txt \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
