name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:md
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v7
        with:
          name: element-screenshotter
          path: artifacts/*.zip
          if-no-files-found: error

  e2e:
    name: End-to-end tests (Chrome for Testing, DPR ${{ matrix.dpr }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Fractional scales catch rounding seams when stitching.
        dpr: ['1', '1.25', '2']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for Testing
        id: chrome
        run: |
          path=$(pnpm dlx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}' | tail -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - name: Allow Chrome's sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Run end-to-end tests
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.path }}
          DPR: ${{ matrix.dpr }}
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-dpr-${{ matrix.dpr }}
          path: test-results/
