name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            from="$PR_BASE"; to="$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE" 2>/dev/null; then
            from="$PUSH_BEFORE"; to=HEAD
          else
            # First push of a branch or tag: check the whole history.
            from=$(git rev-list --max-parents=0 HEAD); to=HEAD
            git log -1 --format=%B "$from" | pnpm exec commitlint --verbose
          fi
          pnpm exec commitlint --from "$from" --to "$to" --verbose

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:md
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm package
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: element-screenshotter
          path: out/*.zip
          if-no-files-found: error

  e2e:
    name: End-to-end (${{ matrix.os }}, DPR ${{ matrix.dpr }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: check
    strategy:
      fail-fast: false
      # Fractional scales catch rounding seams when stitching, so Linux runs
      # several. The tests download Chrome for Testing themselves.
      matrix:
        include:
          - { os: ubuntu-latest, dpr: '1' }
          - { os: ubuntu-latest, dpr: '1.25' }
          - { os: ubuntu-latest, dpr: '2' }
          - { os: windows-latest, dpr: '1' }
          - { os: macos-latest, dpr: '1' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run end-to-end tests
        env:
          DPR: ${{ matrix.dpr }}
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.os }}-dpr-${{ matrix.dpr }}
          path: out/test-results/
          if-no-files-found: ignore
