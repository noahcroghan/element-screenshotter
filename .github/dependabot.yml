version: 2
updates:
  - package-ecosystem: npm # Also covers pnpm lockfiles.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional Commits, so commitlint accepts Dependabot's commits.
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # `typescript` is an alias for the TS 6 API package that typescript-eslint
      # needs (see docs/development.md). Update it by hand once typescript-eslint
      # supports TypeScript 7.1+.
      - dependency-name: typescript
      # @types/node tracks the oldest supported Node.js (engines.node), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    # Also covers the composite action in .github/actions/.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
