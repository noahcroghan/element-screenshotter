name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The goal is to match Firefox Screenshots in Chromium browsers. Ideas that bring the extension closer to Firefox are the most likely to be accepted. Features Firefox doesn't have need a strong case.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the extension do instead?
    validations:
      required: true
  - type: textarea
    id: firefox
    attributes:
      label: Firefox
      description: How does Firefox Screenshots handle this, if you know?
